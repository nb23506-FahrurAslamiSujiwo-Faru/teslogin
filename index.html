
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Supabase Login Test</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <h2>Test Login Supabase</h2>

  <input id="email" type="email"
         placeholder="Email" />
  <br><br>

  <input id="password" type="password"
         placeholder="Password" />
  <br><br>

  <button onclick="testLogin()">Test Login</button>

  <p id="result"></p>

  <script>
    const SUPABASE_URL = "https://pfbhtiwkppxplbyftxjg.supabase.co";
    const SUPABASE_KEY = "sb_publishable_P7S1RwKHQosN7I1Eozu2cw_0HQXRg05";

    const client = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

    async function testLogin() {
      const result = document.getElementById("result");
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;

      result.textContent = "Checking login...";

      const { data, error } =
        await client.auth.signInWithPassword({
          email,
          password
        });

      if (error) {
        result.textContent = "LOGIN GAGAL: " + error.message;
        return;
      }

      result.textContent =
        "LOGIN BERHASIL! User ID: " + data.user.id;

      // Akhiri sesi pengujian
      await client.auth.signOut();
    }
  </script>
</body>
</html>
